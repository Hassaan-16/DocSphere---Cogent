version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  web:
    build: .
    expose:
      - "8000"
    command: >
      sh -c "
        python manage.py collectstatic --noinput &&
        python manage.py migrate &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
      "
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      - redis

  celery:
    build: .
    command: celery -A config.celery:app worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - web

  celery-beat:
    build: .
    command: sh -c "rm -f celerybeat.pid && celery -A config.celery:app beat -l info"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - web

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro   
      - static_volume:/app/staticfiles:ro                        
    depends_on:
      - web

volumes:
  static_volume:
